{%extends 'base.html' %}
{% block content %}


<div class="container">
    <br/><br/><br/><br/>
    <div class="card mb-3">
        <div class="row g-0">
            <div class="col-md-4">
            <img src="{{ product.image.url}}" class="img-fluid rounded-start h-100" style="object-fit: cover;" alt="Product image">
            </div>
            <div class="col-md-8">
            <div class="card-body">
                <center>
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.description }}</p>

                {% if product.is_sale %}
                    <div class="d-flex justify-content-center small text-warning mb-2">
                        <div class="bi-star-fill"></div>
                        &nbsp;&nbsp;Sale!&nbsp;&nbsp;
                        <div class="bi-star-fill"></div>
                    </div>
                    <p class="card-text"><small><strike>${{ product.price }}</strike> ${{ product.sale_price }}</small></p>
                {% else %}
                    <p class="card-text"><small>${{ product.price }}</small></p>
                    
                {% endif %}

                <a href="{% url 'home' %}" class="btn btn-secondary">Home</a>
                <button type="button" value="{{ product.id }}" class="btn btn-secondary" id="add-cart">Add to Cart</button>
                </center>
            </div>
            </div>
        </div>
    </div>
</div>
<br/><br/><br/><br/><br/><br/><br/><br/><br/>
<script>
    //check if button is pressed
    $(document).on('click', '#add-cart', function(e){
       e.preventDefault();
       $.ajax({
        type: 'POST',
        url: '{% url "cart_add" %}',
        data: {
            product_id: $('#add-cart').val(),
            csrfmiddlewaretoken: '{{ csrf_token }}',
            action: 'post'
        },

        success: function (json) {
            //console.log(json);
            document.getElementById('cart_quantity').textContent = json.qty;
        },

        error: function(xhr, errmsg, err){
           // console.log(xhr.status + ": " + xhr.responseText);
        }

       });
    })
        ;
</script>
{% endblock %}
