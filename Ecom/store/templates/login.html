{% extends 'base.html' %}

{% load static %}
{% block content %}

<!-- Header -->

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card border-0 shadow position-relative" style="width: 800px;">
        <!-- Image Panel -->
        <div class="image-panel position-absolute w-50 h-100" style="right: 0; top: 0; z-index: 1;">
            <img src="{% static 'assets/Battlefront.jpg' %}" alt="Login Image" class="img-fluid w-100 h-100" style="object-fit: cover;">
        </div>

        <!-- Form Container -->
        <div class="d-flex w-100 h-100 position-relative" id="form-container" style="z-index: 0;">
            <!-- Login Form -->
            <div class="login-form p-4 w-50">
                <h3>Login</h3>
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" class="form-control" name="username" placeholder="Enter Your Username" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" name="password" placeholder="Enter Your Password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Login</button>
                </form>
                <p class="mt-3 text-center">
                    Don't have an account? <button class="btn btn-link" onclick="showSignUp()">Sign Up</button>
                </p>
            </div>

            <!-- Signup Form -->
            <div class="signup-form p-4 w-50" style="display: none;">
                <h3>Sign Up</h3>
                <form method="POST" action="{% url 'register' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" class="form-control" name="username" placeholder="Enter Username" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" name="first_name" placeholder="Enter First Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" name="last_name" placeholder="Enter Last Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" name="email" placeholder="Enter Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" name="password" placeholder="Enter Password" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Sign Up</button>
                </form>
                <p class="mt-3 text-center">
                    Already have an account? <button class="btn btn-link" onclick="showLogin()">Login</button>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    function showSignUp() {
        // Move the form container to the right to reveal the signup form
        document.getElementById('form-container').style.transform = 'translateX(50%)';
        
        // Show the signup form and hide the login form
        document.querySelector('.login-form').style.display = 'none'; 
        document.querySelector('.signup-form').style.display = 'block'; 
        
        // Slide the image to the left fully
        document.querySelector('.image-panel').style.transform = 'translateX(-100%)'; 
    }

    function showLogin() {
        // Move the form container back to the left to reveal the login form
        document.getElementById('form-container').style.transform = 'translateX(0)';
        
        // Show the login form and hide the signup form
        document.querySelector('.signup-form').style.display = 'none'; 
        document.querySelector('.login-form').style.display = 'block'; 
        
        // Move the image back to the right fully
        document.querySelector('.image-panel').style.transform = 'translateX(0)';
    }
</script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: url("{% static 'assets/NightSky.jpg' %}") center/cover no-repeat;
    }

    .card {
        border-radius: 15px;
        height: 500px; /* Set a fixed height */
        overflow: hidden; /* Prevent height fluctuations */
        background: rgba(255, 255, 255, 0.15) !important; /* translucent white */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.02) !important;
        box-shadow: 32px 32px 32px rgba(0, 0, 0, 0.5) !important;
    }

    .image-panel {
        transition: transform 0.5s ease-in-out;
        height: 100%;
        width: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .btn-link {
        color: #007bff;
        text-decoration: none;
        padding: 0;
    }

    .btn-link:hover {
        color: #0056b3;
        text-decoration: underline;
    }


    #form-container {
        display: flex;
        width: 200%; /* Ensure both forms fit side by side */
        height: 100%;
        transition: transform 0.5s ease-in-out;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        justify-content: center; /* Center content inside */
        width: 50%; /* Adjust width as needed */
    }

    .login-form,
    .signup-form {
        width: 50%;
        height: 100%;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid rgba(255, 255, 255, 0.3);
    }

    

    .image-panel img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

</style>

{% endblock %}
